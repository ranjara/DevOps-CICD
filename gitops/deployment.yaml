apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-demo
  namespace: cicd
  labels:
    app: cicd-demo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: cicd-demo

  template:
    metadata:
      labels:
        app: cicd-demo

    spec:
      containers:
        - name: cicd-demo
          image: ranjara/cicd-demo:7987296
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5000
              name: http

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
